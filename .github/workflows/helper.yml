name: Helper

on:
  push:
    paths:
      - "helper/**"
      - "third_party/finder/**"
      - "team_helper*.go"
  pull_request:
    paths:
      - "helper/**"
      - "third_party/finder/**"
      - "team_helper*.go"

jobs:
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2.2.0
      - name: The helper's tests in happy-dom, on the script hi serves
        run: go test -run 'TestHelperInABrowser|TestTeamHelper' -v .
